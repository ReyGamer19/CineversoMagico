  // Tamaño de letra según el ancho de la pantalla (1280 px = 16 px)

  function getJSON(url, cb) {
    var x;
    try { x = new XMLHttpRequest(); } catch (e) { cb(null); return; }
    x.open("GET", url, true);
    try { x.timeout = 10000; } catch (e) {}
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) { try { cb(JSON.parse(x.responseText)); } catch (e) { cb(null); } }
      else cb(null);
    };
    x.ontimeout = function () { cb(null); };
    try { x.send(null); } catch (e) { cb(null); }
  }

  function cardHTML(m, i) {
    var p = progress[String(m.id)];

    return '<a class="card f" tabindex="0" data-i="' + i + '">' +
      '<div class="poster"><div class="ph">' + esc(m.title) + '</div>' +
      '<img src="' + esc(img(m.bgImage || m.img)) + '" alt="" onerror="this.style.display=\'none\'">' + bar + '</div>' +
      '<div class="t">' + esc(m.title) + '</div></a>';

  function renderRows() {
    var html = "";
    var cont = [], i;
    for (i = 0; i < movies.length; i++) if (progress[String(movies[i].id)]) cont.push(i);
    if (cont.length) {
      html += '<div class="row"><h2>Continuar viendo</h2><div class="rail">';
      for (i = 0; i < cont.length; i++) html += cardHTML(movies[cont[i]], cont[i]);
      html += "</div></div>";
    }
    html += '<div class="row"><h2>Recién agregadas</h2><div class="rail">';
    for (i = 0; i < movies.length; i++) html += cardHTML(movies[i], i);
    html += "</div></div>";
    var groups = {}, order = [];
    for (i = 0; i < movies.length; i++) {
      var g = movies[i].tag || "Otros";
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(i);
    }
    for (var k = 0; k < order.length; k++) {
      if (groups[order[k]].length < 2) continue;
      html += '<div class="row"><h2>' + esc(order[k]) + '</h2><div class="rail">';
      for (i = 0; i < groups[order[k]].length; i++) html += cardHTML(movies[groups[order[k]][i]], groups[order[k]][i]);
      html += "</div></div>";
    }
    $("rows").innerHTML = html;

    if (code === 2) msg("Se cortó la conexión con el servidor del video. Sal y vuelve a intentarlo.");
    else if (code === 3) msg("Esta TV no puede decodificar este video (H.265/HEVC, 10 bits o audio Dolby). Necesita MP4 H.264 + AAC.");
    else if (code === 4) msg("El enlace no funciona o el formato no es compatible con esta TV (MKV o H.265). Necesita MP4 H.264 + AAC.");
    else msg("Este video no se puede reproducir en esta TV.");
  });
  function msg(t) { loading(false); $("playerMsgText").innerHTML = esc(t); show($("playerMsg")); }
  function closePlayer() {
    try { video.pause(); } catch (e) {}
    video.removeAttribute("src");
    try { video.load(); } catch (e) {}
    frame.src = "about:blank";
    loading(false);
    hide($("player"));
    playing = null;
    renderRows();
    if (playerReturn) focusEl(playerReturn);
  }

  // ---------- Clics ----------
  document.addEventListener("click", function (e) {
    var el = e.target;
    while (el && el !== document.body && !el.getAttribute("data-i") && !el.getAttribute("data-ch") && !el.getAttribute("data-go")) el = el.parentNode;
    if (!el || el === document.body) return;
    if (el.getAttribute("data-go")) { goTab(el.getAttribute("data-go")); return; }
    if (el.getAttribute("data-i") !== null && el.getAttribute("data-i") !== "") { openDetail(movies[+el.getAttribute("data-i")]); return; }
    if (el.getAttribute("data-ch")) play(CHANNELS[+el.getAttribute("data-ch")], true);
  }, false);
  $("detailPlay").onclick = function () { if (current) play(current); };
  $("detailBack").onclick = closeDetail;

  // ---------- Control remoto ----------
  function visible(el) {
    if (!el.offsetWidth && !el.offsetHeight) return false;
    var p = el;
    while (p && p !== document.body) { if (isHidden(p)) return false; p = p.parentNode; }
    return true;
  }
  function scope() {
    if (!isHidden($("player"))) return $("player");
    if (!isHidden($("detail"))) return $("detail");
    return document.body;
  }
  function focusables() {
    var all = scope().querySelectorAll(".f"), out = [];
    for (var i = 0; i < all.length; i++) if (visible(all[i])) out.push(all[i]);
    return out;
  }
  var ourTarget = null, ourTime = 0, lastArrow = 0;
  document.addEventListener("focus", function (ev) {
    if (ourTarget && new Date().getTime() - ourTime < 250 && ev.target !== ourTarget) {
      try { ourTarget.focus(); } catch (e) {}
    }
  }, true);
  function focusEl(el) {
    if (!el) return;
    ourTarget = el; ourTime = new Date().getTime();
    try { el.focus(); } catch (e) {}
    // Desplaza la fila horizontal para que la tarjeta se vea
    var rail = el.parentNode;
    if (rail && /\brail\b/.test(rail.className)) {
      var left = el.offsetLeft - rail.offsetLeft - 40;
      rail.scrollLeft = left < 0 ? 0 : left;
    }
    var r = el.getBoundingClientRect();
    var h = window.innerHeight || 720;
    if (scope() === document.body) {
      if (r.top < 90) window.scrollBy(0, r.top - 120);
      else if (r.bottom > h - 20) window.scrollBy(0, r.bottom - h + 60);
      if (el.id === "heroPlay" || el.className.indexOf("tab") !== -1) window.scrollTo(0, 0);
    }
  }
  function move(dir) {
    var items = focusables();
    if (!items.length) return;
    var cur = document.activeElement;
    var idx = -1;
    for (var i = 0; i < items.length; i++) if (items[i] === cur) idx = i;
    if (idx === -1) { focusEl(items[0]); return; }
    var c = cur.getBoundingClientRect();
    var cx = c.left + c.width / 2, cy = c.top + c.height / 2;
    var best = null, bestScore = 1e9;
    for (i = 0; i < items.length; i++) {
      if (i === idx) continue;
      var r = items[i].getBoundingClientRect();
      var x = r.left + r.width / 2, y = r.top + r.height / 2, pr, sc;
      if (dir === "left" || dir === "right") {
        pr = dir === "right" ? x - cx : cx - x;
        if (pr <= 1) continue;
        sc = (r.top < c.bottom && r.bottom > c.top) ? 0 : Math.abs(y - cy) * 3;
      } else {
        pr = dir === "down" ? y - cy : cy - y;
        if (pr <= 1) continue;
        sc = Math.abs(x - cx) * ((r.left < c.right && r.right > c.left) ? 0.3 : 1.2);
      }
      // En filas horizontales las tarjetas ocultas a la derecha también cuentan
      if (pr + sc < bestScore) { bestScore = pr + sc; best = items[i]; }
    }
    if (best) focusEl(best);
    else if (dir === "up") window.scrollTo(0, 0);
  }

  document.addEventListener("keydown", function (e) {
    var k = e.keyCode || e.which;
    var key = e.key || "";
    var playerOpen = !isHidden($("player"));
    if (playerOpen) wakeUi();
    // Atrás: Samsung 10009, LG 461, Escape 27, Retroceso 8, Android/Fire 4 o "GoBack"
    if (k === 10009 || k === 461 || k === 27 || k === 8 || k === 166 || key === "GoBack" || key === "BrowserBack") {
      if (playerOpen) { closePlayer(); e.preventDefault(); return; }
      if (!isHidden($("detail"))) { closeDetail(); e.preventDefault(); return; }
      if (!isHidden($("live"))) { goTab("home"); focusEl($("tabLive")); e.preventDefault(); return; }
      return;
    }
    // Teclas multimedia
    if (playerOpen && !isHidden(video)) {
      if (k === 415 || k === 19 || k === 10252 || k === 179 || key === "MediaPlayPause") {
        if (video.paused) video.play(); else video.pause();
        e.preventDefault(); return;
      }
      if (k === 417 || k === 228) { video.currentTime += 30; e.preventDefault(); return; }
      if (k === 412 || k === 227) { video.currentTime = Math.max(0, video.currentTime - 30); e.preventDefault(); return; }
      if (k === 413) { closePlayer(); e.preventDefault(); return; }
      if (document.activeElement === video) {
        if (k === 13) { if (video.paused) video.play(); else video.pause(); e.preventDefault(); return; }
        if (k === 37) { video.currentTime = Math.max(0, video.currentTime - 10); e.preventDefault(); return; }
        if (k === 39) { video.currentTime += 10; e.preventDefault(); return; }
        if (k === 38 || k === 40) { toggleFit(); e.preventDefault(); return; }
      }
    }
    if (k === 13) {
      var a = document.activeElement;
      if (a && a.className && a.className.indexOf("f") !== -1 && a.tagName !== "VIDEO") {
        if (a.getAttribute("href")) return;
        e.preventDefault();
        if (a.click) a.click();
        else { var ev = document.createEvent("MouseEvents"); ev.initEvent("click", true, true); a.dispatchEvent(ev); }
      }
      return;
    }
    var dir = k === 37 ? "left" : k === 38 ? "up" : k === 39 ? "right" : k === 40 ? "down" : null;
    if (dir) {
      e.preventDefault();
      if (e.stopPropagation) e.stopPropagation();
      var now = new Date().getTime();
      if (now - lastArrow < 140) return;
      lastArrow = now;
      move(dir);
    }
  }, true);

  // Registrar teclas multimedia en Samsung Tizen (si se permite)
  try {
    if (window.tizen && tizen.tvinputdevice) {
      var keys = ["MediaPlayPause", "MediaPlay", "MediaPause", "MediaFastForward", "MediaRewind", "MediaStop"];
      for (var i = 0; i < keys.length; i++) { try { tizen.tvinputdevice.registerKey(keys[i]); } catch (e) {} }
    }
  } catch (e) {}

  try {
    if (navigator.serviceWorker && location.protocol === "https:") navigator.serviceWorker.register("/sw.js");
  } catch (e) {}

  loadCatalog();
})();
</script>
